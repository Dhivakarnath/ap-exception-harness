# OpenTelemetry Collector config — the vendor-neutral hop between the app and
# any trace backend. The app (ap_agent/observability/tracing.py) exports OTLP
# over HTTP to this collector on :4318; the collector fans out to:
#   1. debug   — prints received spans to the collector's own logs, which is our
#                PROOF that the generic OTLP export path works independent of any
#                specific backend (the "swappable backend" design claim).
#   2. otlphttp/langfuse — forwards the same spans to Langfuse's OTLP ingestion
#                endpoint (/api/public/otel) so they render as a trace in the
#                Langfuse UI. Auth is Basic base64(public_key:secret_key), which
#                we inject via ${env:...} so no key is committed here.
#
# This is Langfuse's documented "collector as middle-man" topology: the app never
# needs to know it is talking to Langfuse, which is exactly why the backend is
# swappable by config rather than by code.

receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  # Small batches so a low-volume local run still flushes promptly to the UI.
  batch:
    timeout: 1s
    send_batch_size: 32

exporters:
  # Visible proof: every received span is printed here. `detailed` shows
  # attributes so we can confirm the ap.* nesting (run > node > tool > model >
  # check) actually arrived over the wire.
  debug:
    verbosity: detailed

  # Langfuse ingestion. gRPC is NOT supported by Langfuse — must be otlphttp.
  # The trailing path is required: Langfuse expects /api/public/otel and the
  # exporter appends /v1/traces.
  otlphttp/langfuse:
    endpoint: ${env:LANGFUSE_OTEL_ENDPOINT}
    headers:
      Authorization: ${env:LANGFUSE_OTEL_AUTHORIZATION}
      x-langfuse-ingestion-version: "4"

service:
  telemetry:
    logs:
      level: info
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug, otlphttp/langfuse]
